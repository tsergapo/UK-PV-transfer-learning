# Settings for the whole project. Paths are relative to this folder.

sites_csv: sites.csv        # the sites to build: column ss_id, and role (source = train, target = held out)
test_start: "2023-04-02"    # THE time boundary: nothing from here on is ever used for training
val_months: 12              # the last months before test_start are kept for validation while developing
finetune_months: [1, 3, 12] # how much of a target site's own history (just before test_start) it may use
min_days_per_month: 60      # warn if a site has fewer complete days than this in some month of the year
horizon_hours: 24           # a forecast covers one day, 00:00-23:00 UTC
context_hours: 168          # every scored day needs this much clean history before it, so ALL models
                            # (also the neural networks that read 168 h of past) are scored on the same days
max_gap_halfhours: 1        # fill missing daytime PV readings only if the gap is this short

paths:
  pv_dir: data/raw/uk_pv/30_minutely       # monthly parquet files, all sites
  metadata_csv: data/raw/uk_pv/metadata.csv
  era5_csv: ["data/raw/ERA5/*.csv"]        # file names do not matter
  era5_grib: ["data/raw/ERA5/*.grib"]
  out_dir: data/processed

# Columns every model may use as input.
# (The target yield_kwh_per_kwp, generation_kwh and the daylight flag are never inputs.)
inputs:
  - ssrd          # solar radiation reaching the ground (W/m2)
  - fdir          # direct part of it (W/m2)
  - tcc           # total cloud cover
  - hcc           # high cloud cover
  - mcc           # medium cloud cover
  - lcc           # low cloud cover
  - t2m_c         # air temperature (Celsius)
  - u10           # wind, east-west component
  - v10           # wind, north-south component
  - ws10          # wind speed
  - hour_sin
  - hour_cos
  - doy_sin
  - doy_cos
  - solar_elevation
# Site properties are NOT inputs: with tilt and orientation the model learns each training site's
# scale (they act like a site ID) and transfers worse to new sites. To repeat that comparison, add
# these three lines back:  tilt, orient_sin, orient_cos

# XGBoost settings. The first three are xgboost's own defaults (what the original notebook used).
xgb:
  n_estimators: 100
  max_depth: 6
  learning_rate: 0.3
finetune_trees: 50            # fine-tuning = this many extra trees grown on the target's own data
finetune_learning_rate: 0.1   # step size of those extra trees
